name: Deploy to EC2

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  # ── Build & Lint Check ──
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://${{ secrets.EC2_HOST }}/api
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ap-northeast-1
        run: npm run build

  # ── Deploy (only on push, not PRs) ──
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PRODUCTION_ENV_BACKEND,PRODUCTION_ENV_FRONTEND
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Write production env files from secrets
            printf '%s\n' "$PRODUCTION_ENV_BACKEND" > ~/Greet/backend/.env
            printf '%s\n' "$PRODUCTION_ENV_FRONTEND" > ~/Greet/frontend/.env

            cd ~/Greet && bash scripts/deploy.sh
        env:
          PRODUCTION_ENV_BACKEND: ${{ secrets.PRODUCTION_ENV_BACKEND }}
          PRODUCTION_ENV_FRONTEND: ${{ secrets.PRODUCTION_ENV_FRONTEND }}
