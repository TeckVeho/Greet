# Greet Frontend (Production): https://greet.d-dxlab.com -> localhost:3202
<VirtualHost *:80>
    ServerName greet.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3202/
    ProxyPassReverse / http://127.0.0.1:3202/

    ErrorLog /var/log/httpd/greet.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet.d-dxlab.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet.d-dxlab.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3202/
    ProxyPassReverse / http://127.0.0.1:3202/

    ErrorLog /var/log/httpd/greet.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet.d-dxlab.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet.d-dxlab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet.d-dxlab.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# Greet API (Production): https://greet-api.d-dxlab.com -> localhost:4000
<VirtualHost *:80>
    ServerName greet-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    # Keep max upload size aligned with backend multer limit (10MB)
    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-api.d-dxlab.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet-api.d-dxlab.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-api.d-dxlab.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet.d-dxlab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet.d-dxlab.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
