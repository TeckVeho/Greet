# Bootstrap config for initial certificate issuance on stage.
# Use this temporarily before running certbot.
# Domains:
# - greet-stage.d-dxlab.com -> frontend on 127.0.0.1:3302
# - greet-stage-api.d-dxlab.com -> backend on 127.0.0.1:4300

<VirtualHost *:80>
    ServerName greet-stage.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3302/
    ProxyPassReverse / http://127.0.0.1:3302/

    ErrorLog /var/log/httpd/greet-stage.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage.d-dxlab.com-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName greet-stage-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4300/
    ProxyPassReverse / http://127.0.0.1:4300/

    # Keep max upload size aligned with backend multer limit (10MB)
    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-stage-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage-api.d-dxlab.com-access.log combined
</VirtualHost>
