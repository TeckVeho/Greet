# Bootstrap config for initial certificate issuance on production.
# Use this temporarily before running certbot.
# Domains:
# - greet.d-dxlab.com -> frontend on 127.0.0.1:3202
# - greet-api.d-dxlab.com -> backend on 127.0.0.1:4000

<VirtualHost *:80>
    ServerName greet.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3202/
    ProxyPassReverse / http://127.0.0.1:3202/

    ErrorLog /var/log/httpd/greet.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet.d-dxlab.com-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName greet-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    # Keep max upload size aligned with backend multer limit (10MB)
    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-api.d-dxlab.com-access.log combined
</VirtualHost>
