# Greet Frontend: https://greet.vw-dev.com -> localhost:3002
<VirtualHost *:80>
    ServerName greet.vw-dev.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog /var/log/httpd/greet.vw-dev.com-error.log
    CustomLog /var/log/httpd/greet.vw-dev.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet.vw-dev.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet.vw-dev.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog /var/log/httpd/greet.vw-dev.com-error.log
    CustomLog /var/log/httpd/greet.vw-dev.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet.vw-dev.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet.vw-dev.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# Greet API: https://greet-api.vw-dev.com -> localhost:4000
<VirtualHost *:80>
    ServerName greet-api.vw-dev.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    # Keep max upload size aligned with backend multer limit (10MB)
    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-api.vw-dev.com-error.log
    CustomLog /var/log/httpd/greet-api.vw-dev.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet-api.vw-dev.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet-api.vw-dev.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-api.vw-dev.com-error.log
    CustomLog /var/log/httpd/greet-api.vw-dev.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet.vw-dev.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet.vw-dev.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
