# Greet Frontend (Stage): https://greet-stage.d-dxlab.com -> localhost:3302
<VirtualHost *:80>
    ServerName greet-stage.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3302/
    ProxyPassReverse / http://127.0.0.1:3302/

    ErrorLog /var/log/httpd/greet-stage.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage.d-dxlab.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet-stage.d-dxlab.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet-stage.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3302/
    ProxyPassReverse / http://127.0.0.1:3302/

    ErrorLog /var/log/httpd/greet-stage.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage.d-dxlab.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet-stage.d-dxlab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet-stage.d-dxlab.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# Greet API (Stage): https://greet-stage-api.d-dxlab.com -> localhost:4100
<VirtualHost *:80>
    ServerName greet-stage-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    # Keep max upload size aligned with backend multer limit (10MB)
    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-stage-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage-api.d-dxlab.com-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =greet-stage-api.d-dxlab.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName greet-stage-api.d-dxlab.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    LimitRequestBody 10485760

    ErrorLog /var/log/httpd/greet-stage-api.d-dxlab.com-error.log
    CustomLog /var/log/httpd/greet-stage-api.d-dxlab.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/greet-stage.d-dxlab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/greet-stage.d-dxlab.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
